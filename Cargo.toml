[package]
name = "hpt-validator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Validator for CMS Hospital Price Transparency machine-readable files, a port of @cmsgov/hpt-validator"
license = "CC0-1.0"
repository = "https://github.com/digitalashes/hpt-validator-rs"
keywords = ["cms", "price-transparency", "healthcare", "hospital", "validator"]
categories = ["parser-implementations"]
include = ["/src", "/schemas", "/README.md", "/LICENSE", "/UPSTREAM.lock"]

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
