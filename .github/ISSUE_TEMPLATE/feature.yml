name: Feature
description: Something the crate should do that it does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Default mode returns exactly what upstream returns, so a change to the rules or
        messages belongs upstream. Extended mode and the API are open to proposals.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stands in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
